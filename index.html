<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1ea">
  <title>הרמן בדרכים</title>
  <meta name="description" content="אלבום משפחתי מטיול בן שנה: נפאל · הודו · ויאטנם · סין · אוסטרליה · ניו זילנד · תאילנד">

  <!-- Favicons / app icons (M60). SVG for crisp scaling, .ico/.png fallbacks,
       apple-touch-icon for iOS home-screen. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;500;700&display=swap">

  <script>
    (function () {
      try {
        var s = localStorage.getItem('hermantrip:theme');
        var dark = (s === 'dark') || (!s && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="loading" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span class="loading-text">טוען...</span>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
